<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#c9516f"/>
  <!-- Stylized W flower petals -->
  <g fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center dot -->
    <circle cx="32" cy="32" r="4" fill="#fff" stroke="none"/>
    <!-- Petals -->
    <ellipse cx="32" cy="18" rx="4" ry="7" fill="rgba(255,255,255,0.85)" stroke="none" transform="rotate(0 32 32)"/>
    <ellipse cx="32" cy="18" rx="4" ry="7" fill="rgba(255,255,255,0.85)" stroke="none" transform="rotate(45 32 32)"/>
    <ellipse cx="32" cy="18" rx="4" ry="7" fill="rgba(255,255,255,0.85)" stroke="none" transform="rotate(90 32 32)"/>
    <ellipse cx="32" cy="18" rx="4" ry="7" fill="rgba(255,255,255,0.85)" stroke="none" transform="rotate(135 32 32)"/>
    <ellipse cx="32" cy="18" rx="4" ry="7" fill="rgba(255,255,255,0.85)" stroke="none" transform="rotate(180 32 32)"/>
    <ellipse cx="32" cy="18" rx="4" ry="7" fill="rgba(255,255,255,0.85)" stroke="none" transform="rotate(225 32 32)"/>
    <ellipse cx="32" cy="18" rx="4" ry="7" fill="rgba(255,255,255,0.85)" stroke="none" transform="rotate(270 32 32)"/>
    <ellipse cx="32" cy="18" rx="4" ry="7" fill="rgba(255,255,255,0.85)" stroke="none" transform="rotate(315 32 32)"/>
  </g>
  <!-- Center white circle on top -->
  <circle cx="32" cy="32" r="5" fill="#fff"/>
</svg>
